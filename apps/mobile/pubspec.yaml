name: bridgeforward
description: BridgeForward mobile app — Select, Prepare, Share to WhatsApp.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  image_picker: ^1.0.7
  photo_manager: ^3.2.0
  receive_sharing_intent: ^1.8.0
  share_plus: ^10.0.2
  path_provider: ^2.1.3
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  posthog_flutter: ^4.0.0
  sentry_flutter: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
